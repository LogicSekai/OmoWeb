version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major AGP / Gradle / Kotlin need a manual migration, not a bot bump.
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]
      # androidx.core 1.19+ needs AGP 9.1 and compileSdk 37: wait for the AGP 9 migration.
      - dependency-name: "androidx.core:*"
        versions: [">=1.19.0"]
    groups:
      androidx:
        patterns: ["androidx.*", "org.jetbrains.kotlinx*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
