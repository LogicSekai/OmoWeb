[versions]
agp = "8.13.2"
kotlin = "2.1.0"

# Android Auto runs phone activities on the car screen only on Android 15 (API 35) and newer.
compileSdk = "36"
targetSdk = "36"
minSdk = "35"

androidxCore = "1.15.0"
androidxActivity = "1.9.3"
androidxWebkit = "1.12.1"
carApp = "1.7.0"
androidxLifecycle = "2.8.7"
androidxWork = "2.10.0"
coroutines = "1.9.0"
junit4 = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }
androidx-car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
